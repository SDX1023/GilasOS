title: StudyOS Basics
cards:
  - front: "What is StudyOS?"
    back: "An all-in-one study platform with notes, flashcards, and focus tools"
    hint: "Think of it as Notion for studying"
  - front: "How do wiki-links work?"
    back: "Use [[note-name]] syntax to link between notes"
    hint: "Double brackets"
  - front: "What algorithm do flashcards use?"
    back: "SM-2 (Spaced Repetition Algorithm 2)"
    hint: "It's a classic algorithm from the 80s"
  - front: "How long is a Pomodoro session?"
    back: "25 minutes by default (configurable)"
    hint: "Named after a tomato timer"
  - front: "Where is student progress stored?"
    back: "In localStorage / IndexedDB (browser-side)"
    hint: "No account needed"
  - front: "What file format are reviewers?"
    back: "YAML files with 'title' and 'cards' fields"
    hint: "Similar to frontmatter"
  - front: "Can you use PDF to generate flashcards?"
    back: "Yes, using AI (OpenAI GPT-4 or Anthropic Claude)"
    hint: "Requires an API key"
